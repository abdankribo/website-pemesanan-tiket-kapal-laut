name: Next.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tickets
      AUTH_SECRET: ci-only-secret-change-me-32-characters-minimum
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tickets
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d tickets"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run build
      - name: Smoke test production server
        run: |
          npm run start -- -p 3000 > /tmp/next.log 2>&1 &
          pid=$!
          trap "kill $pid" EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/next.log
          exit 1
